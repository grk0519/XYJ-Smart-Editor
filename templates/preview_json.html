<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Preview JSON</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include '_site_header.html' %}
  {% include '_session_controls.html' %}
  <main class="container json-editor">
    <h2>Preview JSON</h2>
    <pre>{{ json_source }}</pre>
    <div class="button-group">
      <form action="{{ url_for('result_json') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <textarea name="json_source" hidden>{{ json_source }}</textarea>
        <button type="submit">Generate JSON</button>
      </form>
      <form action="{{ url_for('edit_again') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <textarea name="json_source" hidden>{{ json_source }}</textarea>
        <button type="submit">Go Back and Edit</button>
      </form>
    </div>
  </main>
  <script src="{{ url_for('static', filename='session-cleanup.js') }}"></script>
</body>
</html>
