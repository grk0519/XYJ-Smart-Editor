<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Preview YAML</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .container {
      max-width: 700px;
      margin: 0 auto;
      padding: 20px;
    }
    pre {
      background-color: #f0f0f0;
      padding: 15px;
      border-radius: 6px;
      white-space: pre-wrap;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
    }
  </style>
</head>
<body>
  {% include '_site_header.html' %}
  {% include '_session_controls.html' %}
  <div class="container">
    <h2>🔍 Preview YAML Output</h2>
    <pre>{{ yaml_source }}</pre>
    <div class="button-group">
      <form action="{{ url_for('result_yaml') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <textarea name="yaml_source" hidden>{{ yaml_source }}</textarea>
        <button type="submit">✅ Save Changes</button>
      </form>
      <form action="{{ url_for('edit_again') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <textarea name="yaml_source" hidden>{{ yaml_source }}</textarea>
        <button type="submit">Go Back and Edit</button>
      </form>
    </div>
  </div>
  <script src="{{ url_for('static', filename='session-cleanup.js') }}"></script>
</body>
</html>
