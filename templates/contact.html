<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Contact - XYJ Smart Edit</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    body {
      background: #f4f4f4;
      font-family: Arial, sans-serif;
    }

    .contact-container {
      max-width: 600px;
      margin: 80px auto;
      padding: 30px;
      background: #ffffff;
      border-radius: 10px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.07);
      text-align: center;
    }

    h2 {
      color: #003366;
      margin-bottom: 10px;
    }

    p {
      font-size: 1.05em;
      color: #444;
      line-height: 1.6;
    }

    .email-address {
      font-weight: bold;
      color: #005599;
    }

    .home-btn {
      display: inline-block;
      margin-top: 30px;
      padding: 10px 22px;
      background-color: #003366;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .home-btn:hover {
      background-color: #005599;
    }
  </style>
</head>
<body>
  {% include '_site_header.html' %}
  <div class="contact-container">
    <h2>📫 Get in Touch</h2>
    <p>
      Have questions, feedback, or collaboration ideas?<br>
      Feel free to reach out to me directly at:<br>
      <span class="email-address">grk0519@gmail.com</span>
    </p>
    <a href="{{ url_for('home') }}" class="home-btn">🏠 Back to Home</a>
  </div>
  <script src="{{ url_for('static', filename='session-cleanup.js') }}"></script>
</body>
</html>
