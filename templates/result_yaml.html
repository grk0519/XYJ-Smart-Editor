<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Download Ready</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .success-message {
      text-align: center;
      padding: 30px 0;
    }

    .success-message h2 {
      color: #007B83;
      font-size: 2em;
      margin-bottom: 10px;
    }

    .success-message p {
      font-size: 1.1em;
      color: #444;
    }

    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
    }

    .button-group a button {
      padding: 12px 24px;
      background-color: #003366;
      color: white;
      border: none;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .button-group a button:hover {
      background-color: #005599;
    }
  </style>
</head>
<body>
  {% include '_site_header.html' %}
  {% include '_session_controls.html' %}
  <div class="container">
    <div class="success-message">
      <h2>✅ YAML file modified and saved successfully!</h2>
      <p>Your modified file is ready to download or you can head back home to start again.</p>
    </div>

    <div class="button-group">
      <a href="{{ url_for('download') }}"><button>⬇️ Download File</button></a>
      <a href="{{ url_for('home') }}"><button>🏠 Home</button></a>
    </div>
  </div>
  <script src="{{ url_for('static', filename='session-cleanup.js') }}"></script>
</body>
</html>
